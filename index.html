<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mes économies</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Économies">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12302c;--mut:#5d7773;--acc:#0f766e;--acc2:#14b8a6;--line:#dbe6e3;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0b1a18;--card:#132926;--ink:#e6f4f1;--mut:#8fb0aa;--acc:#2dd4bf;--acc2:#14b8a6;--line:#23423d;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.big{font-size:44px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
.sub{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.grid div{background:var(--bg);border-radius:12px;padding:10px}
.grid b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.grid span{font-size:12px;color:var(--mut)}
input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 12px;background:var(--bg);color:var(--ink);min-width:0}
button{background:var(--acc);color:#fff;border:0;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);padding:6px 10px;font-weight:500}
.row{display:flex;gap:8px;margin-top:8px}
.row input:first-child{flex:1}
.row input.p{width:96px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0}
.top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
.ok{color:var(--acc);font-weight:600}
.acts{display:flex;gap:6px;margin-top:8px}
.bought{opacity:.55}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
label input{width:100%;margin-top:4px}
</style>
</head>
<body>
<main>
<h1>Sans tabac depuis <span id="since"></span></h1>

<div class="card">
  <div class="sub">Disponible (hors achats déjà faits)</div>
  <div class="big" id="avail">0,00 €</div>
  <div class="sub" id="total"></div>
  <div class="grid">
    <div><b id="days">–</b><span>sans fumer</span></div>
    <div><b id="cigs">–</b><span>cigarettes évitées</span></div>
    <div><b id="perweek">–</b><span>économisés / semaine</span></div>
    <div><b id="peryear">–</b><span>économisés / an</span></div>
  </div>
</div>

<div class="card">
  <h2>🎁 Ma wishlist</h2>
  <div id="list"></div>
  <form class="row" id="add">
    <input id="n" placeholder="Que veux-tu ?" required>
    <input id="p" class="p" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Prix €" required>
    <button>+</button>
  </form>
  <div class="sub" style="margin-top:8px">Les envies sont financées dans l'ordre de la liste.</div>
</div>

<div class="card">
  <h2>⚙️ Réglages</h2>
  <label>Arrêt (date et heure)<input type="datetime-local" id="s_date"></label>
  <label>Cigarettes fumées par jour<input type="number" inputmode="decimal" id="s_cpd" min="0" step="1"></label>
  <label>Prix du paquet (€)<input type="number" inputmode="decimal" id="s_price" min="0" step="0.01"></label>
  <label>Cigarettes par paquet<input type="number" inputmode="decimal" id="s_pack" min="1" step="1"></label>
  <div class="sub" style="margin-top:10px">Patchs remboursés : aucun coût déduit.</div>
</div>
</main>

<script>
const KEY='stop-tabac-v1';
const def={date:'2026-11-01T12:30',cpd:15,price:11.5,pack:20,wish:[]};
let S;
try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const perDay=()=>S.cpd*S.price/S.pack;
const DAY=864e5;

function render(){
  const start=new Date(S.date).getTime();
  const days=Math.max(0,(Date.now()-start)/DAY);
  const total=days*perDay();
  const spent=S.wish.filter(w=>w.bought).reduce((a,w)=>a+w.price,0);
  const avail=total-spent;
  $('since').textContent=new Date(start).toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  $('avail').textContent=eur(avail);
  $('total').textContent='Total économisé : '+eur(total)+(spent?' · dépensé : '+eur(spent):'');
  const d=Math.floor(days),h=Math.floor((days-d)*24);
  $('days').textContent=d+' j '+h+' h';
  $('cigs').textContent=Math.floor(days*S.cpd).toLocaleString('fr-FR');
  $('perweek').textContent=eur(perDay()*7);
  $('peryear').textContent=eur(perDay()*365);

  let cum=0,html='';
  S.wish.forEach((w,i)=>{
    let info='';
    if(w.bought){info='<span class="sub">Acheté ✔</span>'}
    else{
      cum+=w.price;
      const funded=Math.max(0,Math.min(1,avail/cum>=1?1:(avail-(cum-w.price))/w.price));
      const need=cum-avail;
      if(need<=0)info='<span class="ok">Tu peux te l\'offrir ! 🎉</span>';
      else{
        const when=new Date(Date.now()+need/perDay()*DAY);
        const left=Math.ceil(need/perDay());
        info='<span class="sub">Encore '+eur(need)+' · dans '+left+' j · le '+when.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+'</span>';
      }
      w._pct=Math.round(Math.max(0,Math.min(1,(avail-(cum-w.price))/w.price))*100);
    }
    const pct=w.bought?100:w._pct;
    html+='<div class="item'+(w.bought?' bought':'')+'"><div class="top"><span>'+esc(w.name)+'</span><span>'+eur(w.price)+'</span></div>'
      +'<div class="bar"><i style="width:'+pct+'%"></i></div>'+info
      +'<div class="acts">'
      +(i>0?'<button class="ghost" data-a="up" data-i="'+i+'">↑</button>':'')
      +(i<S.wish.length-1?'<button class="ghost" data-a="dn" data-i="'+i+'">↓</button>':'')
      +'<button class="ghost" data-a="buy" data-i="'+i+'">'+(w.bought?'Annuler achat':'Acheté')+'</button>'
      +'<button class="ghost" data-a="del" data-i="'+i+'">Suppr.</button></div></div>';
  });
  $('list').innerHTML=html||'<div class="sub">Ajoute ta première envie ci-dessous.</div>';
}

$('add').onsubmit=e=>{
  e.preventDefault();
  const p=parseFloat($('p').value.replace(',','.'));
  if(!(p>=0))return;
  S.wish.push({name:$('n').value.trim(),price:p,bought:false});
  $('n').value='';$('p').value='';save();render();
};
$('list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=+b.dataset.i,a=b.dataset.a,w=S.wish;
  if(a==='del'){if(!confirm('Supprimer « '+w[i].name+' » ?'))return;w.splice(i,1)}
  if(a==='buy')w[i].bought=!w[i].bought;
  if(a==='up')[w[i-1],w[i]]=[w[i],w[i-1]];
  if(a==='dn')[w[i+1],w[i]]=[w[i],w[i+1]];
  save();render();
};
[['s_date','date'],['s_cpd','cpd'],['s_price','price'],['s_pack','pack']].forEach(([id,k])=>{
  $(id).value=S[k];
  $(id).onchange=()=>{
    const v=$(id).value;
    if(k==='date'){if(v)S.date=v}
    else{const n=parseFloat(v.replace(',','.'));if(n>0)S[k]=n}
    save();render();
  };
});
render();setInterval(render,15000);
document.addEventListener('visibilitychange',render);
</script>
</body>
</html>
